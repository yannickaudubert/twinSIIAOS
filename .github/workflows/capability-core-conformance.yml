name: Capability Core Conformance

on:
  push:
    branches:
      - main
      - 'work/**'
    paths:
      - 'capability-core/**'
      - 'resource-radar-v3/**'
      - 'public-resource-hub/**'
      - 'building-projection/**'
      - '.github/workflows/capability-core-conformance.yml'
  pull_request:
    paths:
      - 'capability-core/**'
      - 'resource-radar-v3/**'
      - 'public-resource-hub/**'
      - 'building-projection/**'
      - '.github/workflows/capability-core-conformance.yml'

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python unit tests
        run: python -m unittest capability-core/tests/test_engine.py

      - name: JavaScript unit tests
        run: node capability-core/tests/test_engine.js

      - name: HTTP sidecar tests
        run: python -m unittest capability-core/tests/test_sidecar.py

      - name: Skill inventory collector tests
        run: python -m unittest skill-registry/tests/test_collect_local_skills.py

      - name: Building projection tests
        run: python -m unittest building-projection/tests/test_catalog.py

      - name: Building heritage tests
        run: python -m unittest building-projection/tests/test_heritage.py

      - name: Validate MCP v2 adapter
        run: |
          python -m pip install "mcp>=2,<3"
          python -c "import runpy; runpy.run_path('adapters/mcp/server.py', run_name='siiaos_mcp_check')"

      - name: Build capability core container
        run: docker build -f capability-core/Dockerfile -t siiaos-capability-core:test .

      - name: Cross-runtime conformance
        run: python capability-core/conformance/run_conformance.py

      - name: Prevent web projection drift
        run: python capability-core/conformance/check_projection_drift.py

      - name: Syntax-check browser JavaScript
        run: |
          node --check capability-core/engine.js
          node --check public-resource-hub/vendor/capability-core.js
          node --check public-resource-hub/registry-adapter.js
          node --check public-resource-hub/app.js

      - name: Validate JSON syntax
        run: |
          python -m json.tool capability-core/protocol.schema.json > /dev/null
          python -m json.tool capability-core/conformance/cases.json > /dev/null
          python -m json.tool capability-core/conformance/lifecycle-cases.json > /dev/null
          python -m json.tool resource-radar-v3/capability-record.schema.json > /dev/null
          python -m json.tool resource-radar-v3/registry.bootstrap.json > /dev/null
          python -m json.tool skill-registry/families.json > /dev/null
          python -m json.tool skill-registry/current-chatgpt.inventory.json > /dev/null
          python -m json.tool skill-registry/community-candidates.seed.json > /dev/null
          python -m json.tool skill-registry/inventory.schema.json > /dev/null
          python -m json.tool building-projection/building.schema.json > /dev/null
          python -m json.tool building-projection/event.schema.json > /dev/null
          python -m json.tool building-projection/catalog.json > /dev/null
          python -m json.tool building-projection/heritage-map.json > /dev/null
          python -m json.tool building-projection/views.json > /dev/null
          python -m json.tool building-projection/city-fabric-baseline.json > /dev/null
          for f in building-projection/buildings/*.json; do python -m json.tool "$f" > /dev/null; done
