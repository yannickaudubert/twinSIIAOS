name: Front A CI

on:
  push:
    branches:
      - "front-a/**"
  pull_request:

concurrency:
  group: front-a-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract test dependency
        run: python -m pip install jsonschema
      - name: Validate Front A contract tests
        run: python -m unittest discover -s tests -p "test_*.py"
