name: Radar V4 CI

on:
  pull_request:
    paths:
      - "resource-radar-v4/**"
      - ".github/workflows/radar-v4-ci.yml"
  push:
    branches:
      - radar-v4-convergence
    paths:
      - "resource-radar-v4/**"
      - ".github/workflows/radar-v4-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q resource-radar-v4/local
      - name: Run bridge tests
        run: python -m unittest discover -s resource-radar-v4/local -p "test_*.py" -v
      - name: Parse JSON contracts and projections
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = list(Path('resource-radar-v4/contracts').glob('*.json')) + list(Path('resource-radar-v4/projections').glob('*.json'))
          for path in paths:
              json.loads(path.read_text(encoding='utf-8'))
              print('OK', path)
          PY
      - name: Smoke-test exporter and Free/Expert boundary
        run: |
          mkdir -p /tmp/siiaos-registry/resources /tmp/siiaos-projections
          cat > /tmp/siiaos-registry/resources/example.json <<'JSON'
          {
            "id": "system:example",
            "projection_keys": {"consultant_slug": "example", "radar_slug": "example"},
            "kind": "system",
            "title": "Example",
            "summary": "Example resource",
            "capabilities": ["test"],
            "approaches": ["example approach"],
            "state": "tested",
            "competitive_position": "champion",
            "benchmark_summary": "Detailed benchmark conclusion that must not leak in radar-public",
            "evidence_ids": ["ev:1", "ev:2"],
            "fit": [{"context": "sandy", "score": 91, "confidence": 0.8}],
            "blast_radius": "contextual architecture impact",
            "known_gaps": ["public gap"],
            "publication": {"local": true, "radar_public": true, "consultant_site": true}
          }
          JSON
          python resource-radar-v4/local/export_projections.py --registry /tmp/siiaos-registry --out /tmp/siiaos-projections
          python - <<'PY'
          import json
          from pathlib import Path

          c = json.loads(Path('/tmp/siiaos-projections/consultant-site.json').read_text())
          r = json.loads(Path('/tmp/siiaos-projections/radar-public.json').read_text())
          report = json.loads(Path('/tmp/siiaos-projections/export-report.json').read_text())

          assert 'example' in c['items']
          assert c['items']['example']['competitive_position'] == 'champion'
          assert c['items']['example']['fit_score'] == 91

          public = r['items'][0]
          assert public['id'] == 'system:example'
          assert public['known_gaps'] == ['public gap']
          assert public['expert_available']['evidence_count'] == 2
          assert public['expert_available']['benchmark'] is True
          assert public['expert_available']['fit'] is True
          assert public['expert_available']['contextual_position'] is True

          forbidden = {'fit', 'competitive_position', 'benchmark_summary', 'blast_radius'}
          leaked = forbidden.intersection(public)
          assert not leaked, f'Expert fields leaked into public projection: {sorted(leaked)}'
          assert report['expert_static_projection_written'] is False
          print('projection smoke test and Free/Expert boundary OK')
          PY
